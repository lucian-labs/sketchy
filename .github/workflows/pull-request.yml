on: pull_request

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v1
        with:
          # node:test is the test runner, so 14 is no longer enough
          node-version: 20.x

      - run: npm i
      - run: npm run lint
      - run: npm test
